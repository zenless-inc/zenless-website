    <rect x="0" y="233" width="372" height="85" fill="#15171d"/>
    <path d="M0 233 H372 V302 A16 16 0 0 1 356 318 H16 A16 16 0 0 1 0 302 Z" fill="#15171d"/>
    <text x="18" y="256" fill="#8a90a0" font-family="'Geist Mono', monospace" font-size="11">12 connections · dynamic segmentation</text>

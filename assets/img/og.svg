      <text x="354" y="72" text-anchor="end" fill="#d4ff3f" font-family="'Geist Mono', monospace" font-size="12">48.2 MB/s</text>

      <text x="18" y="104">blender-4.5.3-windows-x64.msi</text>
      <rect x="18" y="114" width="250" height="5" rx="2.5" fill="#1e2129"/>

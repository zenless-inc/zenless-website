<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Open Graph card source. og.png is rendered from this file with the site's
       web fonts (Bricolage Grotesque / Geist / Geist Mono) loaded. -->
  <style>.display{font-variation-settings:"opsz" 96}</style>
  <defs>
    <linearGradient id="og-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ff3f"/>
      <stop offset="1" stop-color="#3fd8ff"/>
    </linearGradient>
    <linearGradient id="og-mark" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="216" y2="216">
      <stop offset="0" stop-color="#d4ff3f"/>
      <stop offset="1" stop-color="#3fd8ff"/>
    </linearGradient>
    <linearGradient id="og-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fe86a"/>
      <stop offset="1" stop-color="#d4ff3f"/>
    </linearGradient>
    <radialGradient id="og-glow-a" cx="0.22" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#d4ff3f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d4ff3f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow-b" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#3fd8ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3fd8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="og-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2a2e38" stroke-opacity="0.55" stroke-width="1"/>
    </pattern>
    <linearGradient id="og-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="og-grid-mask"><rect width="1200" height="630" fill="url(#og-fade)"/></mask>
  </defs>

  <rect width="1200" height="630" fill="#0d0e12"/>
  <rect width="1200" height="630" fill="url(#og-grid)" mask="url(#og-grid-mask)"/>
  <rect width="1200" height="630" fill="url(#og-glow-a)"/>
  <rect width="1200" height="630" fill="url(#og-glow-b)"/>

  <!-- Brand -->

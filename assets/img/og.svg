  <text class="display" x="148" y="108" fill="#eceef3" font-family="'Bricolage Grotesque', 'Segoe UI', sans-serif" font-size="34" font-weight="700" letter-spacing="-1">Zenless</text>

  <!-- Headline -->
  <g class="display" font-family="'Bricolage Grotesque', 'Segoe UI', sans-serif" font-size="84" font-weight="750" letter-spacing="-3.2">
    <text x="68" y="252" fill="#eceef3">Download faster.</text>
    <text x="68" y="336" fill="#eceef3">Torrent smarter.</text>
    <text x="68" y="420" fill="url(#og-grad)">Stay zen.</text>
  </g>
  <text x="72" y="482" fill="#a9aebb" font-family="'Geist', 'Segoe UI', sans-serif" font-size="26">Free, open-source Windows apps written in Rust.</text>


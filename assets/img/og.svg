      <text x="354" y="168" text-anchor="end" fill="#8a90a0" font-family="'Geist Mono', monospace" font-size="12">21.0 MB/s</text>

      <text x="18" y="200">rustup-init.exe</text>
      <rect x="18" y="210" width="250" height="5" rx="2.5" fill="#5ee29a"/>
      <text x="354" y="216" text-anchor="end" fill="#5ee29a" font-family="'Geist Mono', monospace" font-size="12">Done</text>
    </g>

    <!-- Segment map -->

      <text x="354" y="120" text-anchor="end" fill="#8a90a0" font-family="'Geist Mono', monospace" font-size="12">9.4 MB/s</text>

      <rect x="0" y="129" width="372" height="48" fill="#121419"/>
      <text x="18" y="152">sintel-2010-open-movie-4k.mkv</text>
      <rect x="18" y="162" width="250" height="5" rx="2.5" fill="#1e2129"/>
